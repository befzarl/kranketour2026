<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Kranke Tour 2026 Karte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    #legend {
      position: absolute;
      bottom: 30px;
      left: 10px;
      background: white;
      border-radius: 6px;
      box-shadow: 0 0 6px #888;
      font-size: 14px;
      z-index: 1000;
      overflow: hidden;
    }
    #legend-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: bold;
      user-select: none;
      white-space: nowrap;
    }
    #legend-toggle span { font-size: 11px; opacity: 0.6; }
    #legend-body {
      max-height: 38vh;
      overflow-y: auto;
      padding: 0 10px 10px;
    }
    .panel-collapse-btn {
      font-size: 11px;
      line-height: 1;
      padding: 1px 5px;
      cursor: pointer;
      border: 1px solid #aaa;
      border-radius: 3px;
      background: #f5f5f5;
      float: right;
      margin-left: 6px;
    }
    .leaflet-control-layers-expanded {
      max-height: 60vh;
      overflow-y: auto;
    }
    @media (max-width: 600px) {
      #legend {
        bottom: 50px;
        max-width: calc(100vw - 100px);
        font-size: 12px;
      }
      #legend-body {
        max-height: 22vh;
      }
      .leaflet-control-layers-expanded {
        max-width: calc(100vw - 70px);
        max-height: 45vh;
        font-size: 13px;
      }
      .leaflet-control-layers-selector {
        width: 18px;
        height: 18px;
        vertical-align: middle;
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="legend">
    <div id="legend-toggle">Lostopf-Legende <span id="legend-arrow">▲</span></div>
    <div id="legend-body"></div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="coordinates.js"></script>
  <script>
    const map = L.map('map').setView([51, 10], 6);
    const bw = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors & CartoDB'
    }).addTo(map);
    const railwayLayer = L.tileLayer('https://tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png', {
      minZoom: 2,
      maxZoom: 19,
      tileSize: 256,
      attribution: '<a href="https://www.openstreetmap.org/copyright">&copy; OpenStreetMap contributors</a>, Style: <a href="https://creativecommons.org/licenses/by-sa/2.0/">CC-BY-SA 2.0</a> <a href="https://www.openrailwaymap.org/">OpenRailwayMap</a>',
      opacity: 0.7
    }).addTo(map);

    const classicMarkers = L.layerGroup();
    const bhfPaarLayer = L.layerGroup();
    const partnerCityLayer = L.layerGroup();
    const categoryLayers = Object.fromEntries(
      Object.keys(lostopfColors).map(name => [name, L.layerGroup().addTo(map)])
    );
    const primaryFeatures = [];
    const secondaryFeatures = [];

    const isMobile = window.matchMedia('(max-width: 600px)').matches;
    const mobileScale = isMobile ? 0.75 : 1;

    function markerRadius(points) {
      return Math.min(17, Math.max(5, Math.sqrt(Number(points || 0)) * 1.1)) * mobileScale;
    }

    function makePieMarker(latlng, radius, colors, popup, popupOptions) {
      if (colors.length === 1) {
        return L.circleMarker(latlng, {
          radius, color: colors[0], fillColor: colors[0], fillOpacity: 1, weight: 2
        }).bindPopup(popup, popupOptions);
      }
      const r = radius;
      const size = (r + 1) * 2;
      const cx = r + 1, cy = r + 1;
      const n = colors.length;
      let paths = '';
      for (let i = 0; i < n; i++) {
        const a0 = (i / n) * 2 * Math.PI - Math.PI / 2;
        const a1 = ((i + 1) / n) * 2 * Math.PI - Math.PI / 2;
        const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
        const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
        const large = n === 1 ? 1 : 0;
        paths += `<path d="M${cx},${cy} L${x0},${y0} A${r},${r} 0 ${large},1 ${x1},${y1} Z" fill="${colors[i]}"/>`;
      }
      const svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">`
        + `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#fff" stroke-width="1"/>`
        + paths
        + `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>`
        + `</svg>`;
      return L.marker(latlng, {
        icon: L.divIcon({ html: svg, className: '', iconSize: [size, size], iconAnchor: [cx, cy] }),
        interactive: true
      }).bindPopup(popup, popupOptions);
    }

    function groupPopup(group) {
      const first = group[0];
      let html = `<b>Bahnhof: ${first.bahnhof || '-'}</b><br>Punkte Bahnhof: ${first.punkte_bahnhof ?? '-'}`;
      if (group.length === 1) {
        const c = group[0];
        html += `<br>Los: ${c.id} &mdash; Lostopf: ${c.lostopf}`
          + `<br>Punkte Aufgabe: ${c.punkte_aufgabe ?? '-'}${c.punkte_bonus ? ` + ${c.punkte_bonus} Bonus` : ''}`
          + `<br>${c.aufgabe || ''}`;
      } else {
        html += group.map(c =>
          `<hr style="margin:4px 0">`
          + `<b>${c.id}</b> &mdash; ${c.lostopf}<br>`
          + `Aufgabe: ${c.punkte_aufgabe ?? '-'}${c.punkte_bonus ? ` + ${c.punkte_bonus} Bonus` : ''} Pkt.<br>`
          + `${c.aufgabe || ''}`
        ).join('');
      }
      return `<div style="max-width:280px">${html}</div>`;
    }


    function stationPopup(coord) {
      return `<b>Bahnhof: ${coord.bahnhof || '-'}</b><br>
        Los: ${coord.id}<br>
        Punkte Bahnhof: ${coord.punkte_bahnhof ?? '-'}<br>
        Lostopf: ${coord.lostopf}<br>
        Aufgabenbeschreibung: ${coord.aufgabe || '-'}`;
    }

    function taskPopup(coord) {
      return `<b>Aufgabe: ${coord.aufgabenadresse || '-'}</b><br>
        Los: ${coord.id}<br>
        Zeitbedarf: ${coord.zeitbedarf ?? '-'} min<br>
        Distanz: ${coord.distanz ?? '-'} km<br>
        Punkte Aufgabe: ${coord.punkte_aufgabe ?? '-'}<br>
        Punkte Bonus: ${coord.punkte_bonus ?? '-'}<br>
        Lostopf: ${coord.lostopf}<br>
        Aufgabenbeschreibung: ${coord.aufgabe || '-'}`;
    }

    if (Array.isArray(coordinates)) {
      // Group entries by station coordinates so duplicate stations share one dot
      const stationGroups = new Map();
      coordinates.forEach(coord => {
        const key = `${coord.latitude},${coord.longitude}`;
        if (!stationGroups.has(key)) stationGroups.set(key, []);
        stationGroups.get(key).push(coord);
      });

      stationGroups.forEach(group => {
        const first = group[0];
        const latlng = [first.latitude, first.longitude];
        // Bhf dot: use the coord with the highest punkte_bahnhof as the station "owner"
        const owner = group.reduce((a, b) => Number(b.punkte_bahnhof || 0) > Number(a.punkte_bahnhof || 0) ? b : a);
        const ownerColor = lostopfColors[owner.lostopf] || lostopfColors.Unbekannt;
        const ownerLayer = categoryLayers[owner.lostopf] || categoryLayers.Unbekannt;

        const classicMarker = L.marker(latlng).bindPopup(groupPopup(group), { maxWidth: 300 });
        const pieColors = [...new Set(group.map(c => lostopfColors[c.lostopf] || lostopfColors.Unbekannt))];
        const categoryMarker = makePieMarker(latlng, markerRadius(owner.punkte_bahnhof), pieColors, groupPopup(group), { maxWidth: 300 });

        // Stacked rings: each coord contributes its own colored solid + dashed ring
        const rings = []; // { marker, categoryLayer }
        let currentRadius = markerRadius(owner.punkte_bahnhof) / mobileScale;
        for (const coord of group) {
          const coordColor = lostopfColors[coord.lostopf] || lostopfColors.Unbekannt;
          const coordLayer = categoryLayers[coord.lostopf] || categoryLayers.Unbekannt;
          const aufgabe = Number(coord.punkte_aufgabe || 0);
          if (aufgabe > 0) {
            currentRadius = Math.min(40, currentRadius + Math.max(4, Math.sqrt(aufgabe) * 1.1));
            rings.push({ marker: L.circleMarker(latlng, {
              radius: currentRadius * mobileScale,
              color: coordColor, fill: false, weight: 2
            }).bindPopup(groupPopup(group)), categoryLayer: coordLayer, coord });
          }
          const bonus = Number(coord.punkte_bonus || 0);
          if (bonus > 0) {
            currentRadius = Math.min(50, currentRadius + Math.max(4, Math.sqrt(bonus) * 1.1));
            rings.push({ marker: L.circleMarker(latlng, {
              radius: currentRadius * mobileScale,
              color: coordColor, fill: false, weight: 2, dashArray: '4, 5'
            }).bindPopup(groupPopup(group)), categoryLayer: coordLayer, coord });
          }
        }

        primaryFeatures.push({ coords: group, classicMarker, categoryMarker, markerLayers: [...new Set(group.map(c => categoryLayers[c.lostopf] || categoryLayers.Unbekannt))], ownerLayer, rings });

        group.forEach(coord => {
          const taskColor = lostopfColors[coord.lostopf] || lostopfColors.Unbekannt;
          const taskLayer = categoryLayers[coord.lostopf] || categoryLayers.Unbekannt;

          // Per-lot zoomed-in view: filled bhf dot at station, rings at aufgabe location
          const bhfDot = makePieMarker(latlng, markerRadius(coord.punkte_bahnhof), [taskColor], stationPopup(coord));

          const aufgabeLatlng = (coord.latitude2 !== null && coord.longitude2 !== null)
            ? [coord.latitude2, coord.longitude2] : latlng;
          const aufgabeR = markerRadius(coord.punkte_bahnhof) / mobileScale
            + Math.max(4, Math.sqrt(Number(coord.punkte_aufgabe || 0)) * 1.1);
          const aufgabeRing = L.circleMarker(aufgabeLatlng, {
            radius: Math.min(28, aufgabeR) * mobileScale,
            color: taskColor, fill: false, weight: 2
          }).bindPopup(taskPopup(coord));
          const bonusRing = coord.punkte_bonus ? L.circleMarker(aufgabeLatlng, {
            radius: Math.min(38, aufgabeR + Math.max(4, Math.sqrt(Number(coord.punkte_bonus)) * 1.1)) * mobileScale,
            color: taskColor, fill: false, weight: 2, dashArray: '4, 5'
          }).bindPopup(taskPopup(coord)) : null;

          const zoomedMarkers = [bhfDot, aufgabeRing, ...(bonusRing ? [bonusRing] : [])];

          if (coord.latitude2 !== null && coord.longitude2 !== null) {
            const line = L.polyline([[coord.latitude, coord.longitude], [coord.latitude2, coord.longitude2]], {
              color: taskColor, weight: 2, opacity: 0.7, dashArray: '4, 8'
            });
            secondaryFeatures.push({ coord, line, zoomedMarkers, categoryLayer: taskLayer });
          } else {
            secondaryFeatures.push({ coord, line: null, zoomedMarkers, categoryLayer: taskLayer });
          }
        });
      });
    }

    function meetsPointFilter(coord) {
      const minimumStationPoints = Number(document.getElementById('bahnhof-punkte-filter').value) || 0;
      const minimumTaskPoints = Number(document.getElementById('aufgaben-punkte-filter').value) || 0;
      const minimumTotalPoints = Number(document.getElementById('gesamt-punkte-filter').value) || 0;
      const total = Number(coord.punkte_bahnhof || 0) + Number(coord.punkte_aufgabe || 0) + Number(coord.punkte_bonus || 0);
      return Number(coord.punkte_bahnhof || 0) >= minimumStationPoints
        && Number(coord.punkte_aufgabe || 0) >= minimumTaskPoints
        && total >= minimumTotalPoints;
    }

    function groupMeetsFilter(coords) {
      return coords.some(meetsPointFilter);
    }

    function updateMarkerVisibility() {
      const showTasks = map.getZoom() >= 15;
      primaryFeatures.forEach(({ coords, classicMarker, categoryMarker, markerLayers, ownerLayer, rings }) => {
        const anyLayerOn = markerLayers.some(l => map.hasLayer(l));
        const visible = anyLayerOn && groupMeetsFilter(coords);
        if (visible) {
          if (map.hasLayer(classicMarkers)) classicMarker.addTo(classicMarkers);
          else { classicMarkers.removeLayer(classicMarker); map.removeLayer(classicMarker); }
          categoryMarker.addTo(ownerLayer);
          if (showTasks) {
            rings.forEach(({ marker: r }) => ownerLayer.removeLayer(r));
          } else {
            rings.forEach(({ marker: r }) => r.addTo(ownerLayer));
          }
        } else {
          classicMarkers.removeLayer(classicMarker);
          map.removeLayer(classicMarker);
          ownerLayer.removeLayer(categoryMarker);
          map.removeLayer(categoryMarker);
          rings.forEach(({ marker: r }) => { ownerLayer.removeLayer(r); map.removeLayer(r); });
        }
      });

      secondaryFeatures.forEach(({ coord, line, zoomedMarkers, categoryLayer }) => {
        if (showTasks && map.hasLayer(categoryLayer) && meetsPointFilter(coord)) {
          zoomedMarkers.forEach(m => m.addTo(categoryLayer));
          if (line) line.addTo(categoryLayer);
        } else {
          zoomedMarkers.forEach(m => categoryLayer.removeLayer(m));
          if (line) categoryLayer.removeLayer(line);
        }
      });
    }

    function updatePointFilter() {
      document.getElementById('bahnhof-punkte-wert').value = document.getElementById('bahnhof-punkte-filter').value;
      document.getElementById('aufgaben-punkte-wert').value = document.getElementById('aufgaben-punkte-filter').value;
      document.getElementById('gesamt-punkte-wert').value = document.getElementById('gesamt-punkte-filter').value;
      updateMarkerVisibility();
    }

    map.on('zoomend overlayadd overlayremove', updateMarkerVisibility);

    if (Array.isArray(bhfPaarLines)) {
      bhfPaarLines.forEach(lineCoords => {
        L.polyline(lineCoords, { color: lostopfColors['Bhf-Paare'], weight: 2, opacity: 0.7, dashArray: '6, 6' }).addTo(bhfPaarLayer);
      });
    }
    if (Array.isArray(partnerCityLines)) {
      partnerCityLines.forEach(lineCoords => {
        L.polyline(lineCoords, { color: lostopfColors['Partnerstädte'], weight: 2, opacity: 0.7, dashArray: '6, 6' }).addTo(partnerCityLayer);
      });
    }

    if (coordinates.length) {
      map.fitBounds(L.latLngBounds(coordinates.map(coord => [coord.latitude, coord.longitude])), { padding: [20, 20] });
    }

    document.getElementById('legend-body').innerHTML = Object.entries(lostopfColors)
      .map(([name, color]) => `<span style="display:inline-block;width:16px;height:16px;background:${color};margin-right:6px;border-radius:50%;border:1px solid #888"></span>${name}`)
      .join('<br>');

    document.getElementById('legend-toggle').addEventListener('click', () => {
      const body = document.getElementById('legend-body');
      const arrow = document.getElementById('legend-arrow');
      const collapsed = body.style.display === 'none';
      body.style.display = collapsed ? '' : 'none';
      arrow.textContent = collapsed ? '▲' : '▼';
    });

    const allOverlays = {
      'OpenRailwayMap': railwayLayer,
      'Klassische Marker': classicMarkers,
      'Bahnhofspaar-Linien': bhfPaarLayer,
      'Partnerstadt-Linien': partnerCityLayer
    };
    Object.entries(categoryLayers).forEach(([name, layer]) => {
      allOverlays[`Lostopf: ${name}`] = layer;
    });
    const compactLayout = window.matchMedia('(max-width: 600px)').matches;
    const layerControl = L.control.layers({ 'Schwarz-Weiß': bw }, allOverlays, { collapsed: compactLayout }).addTo(map);

    // Collapse button for layer control — wrap with a header div matching the legend style
    let lcCollapsed = false;
    const lcContainer = layerControl.getContainer();
    const lcHeader = document.createElement('div');
    lcHeader.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:6px 10px;font-weight:bold;cursor:pointer;user-select:none;white-space:nowrap;';
    lcHeader.innerHTML = 'Ebenen &amp; Filter <span style="font-size:11px;opacity:0.6">▲</span>';
    L.DomEvent.disableClickPropagation(lcHeader);
    lcContainer.insertBefore(lcHeader, lcContainer.firstChild);
    lcHeader.addEventListener('click', () => {
      lcCollapsed = !lcCollapsed;
      lcContainer.querySelector('.leaflet-control-layers-list').style.display = lcCollapsed ? 'none' : '';
      toggleBtn.style.display = lcCollapsed ? 'none' : '';
      sliderHr.style.display = lcCollapsed ? 'none' : '';
      sliderPanel.style.display = lcCollapsed ? 'none' : '';
      lcHeader.querySelector('span').textContent = lcCollapsed ? '▼' : '▲';
    });

    // Insert a CSS divider after the 4th overlay label (before Lostopf entries)
    // Use a MutationObserver so the HR survives Leaflet re-renders
    function injectLayerDivider() {
      const layersList = layerControl.getContainer().querySelector('.leaflet-control-layers-overlays');
      if (!layersList) return;
      const labels = layersList.querySelectorAll('label');
      if (labels[3] && !layersList.querySelector('.layer-section-divider')) {
        const hr = document.createElement('hr');
        hr.className = 'layer-section-divider';
        hr.style.cssText = 'margin:4px 0;border:none;border-top:1px solid #bbb;';
        labels[3].insertAdjacentElement('afterend', hr);
      }
    }
    injectLayerDivider();
    new MutationObserver(injectLayerDivider).observe(
      layerControl.getContainer().querySelector('.leaflet-control-layers-overlays'),
      { childList: true }
    );

    // Button + sliders live outside the layers list so Leaflet re-renders can't remove them
    const toggleBtn = document.createElement('button');
    toggleBtn.textContent = 'Alle Kategorien abwählen';
    toggleBtn.style.cssText = 'display:block;width:calc(100% - 12px);margin:4px 6px 6px;font-size:12px;padding:3px 6px;cursor:pointer;border:1px solid #aaa;border-radius:4px;background:#f5f5f5;box-sizing:border-box;';
    L.DomEvent.disableClickPropagation(toggleBtn);
    layerControl.getContainer().appendChild(toggleBtn);

    const sliderHr = document.createElement('hr');
    sliderHr.style.cssText = 'margin:4px 0;border:none;border-top:1px solid #bbb;';
    layerControl.getContainer().appendChild(sliderHr);

    const sliderPanel = document.createElement('div');
    sliderPanel.style.cssText = 'padding:4px 6px 6px;display:grid;gap:5px;font-size:12px;';
    sliderPanel.innerHTML = `
      <label style="display:grid;gap:2px">
        <span style="display:flex;justify-content:space-between">Mind. Bahnhofspunkte <output id="bahnhof-punkte-wert" style="min-width:3ch;text-align:right">0</output></span>
        <input id="bahnhof-punkte-filter" type="range" min="0" max="750" step="5" value="0" style="width:100%" />
      </label>
      <label style="display:grid;gap:2px">
        <span style="display:flex;justify-content:space-between">Mind. Aufgabenpunkte <output id="aufgaben-punkte-wert" style="min-width:3ch;text-align:right">0</output></span>
        <input id="aufgaben-punkte-filter" type="range" min="0" max="120" step="5" value="0" style="width:100%" />
      </label>
      <label style="display:grid;gap:2px">
        <span style="display:flex;justify-content:space-between">Mind. Gesamtpunkte <output id="gesamt-punkte-wert" style="min-width:3ch;text-align:right">0</output></span>
        <input id="gesamt-punkte-filter" type="range" min="0" max="900" step="5" value="0" style="width:100%" />
      </label>`;
    L.DomEvent.disableClickPropagation(sliderPanel);
    L.DomEvent.disableScrollPropagation(sliderPanel);
    layerControl.getContainer().appendChild(sliderPanel);

    document.getElementById('bahnhof-punkte-filter').addEventListener('input', updatePointFilter);
    document.getElementById('aufgaben-punkte-filter').addEventListener('input', updatePointFilter);
    document.getElementById('gesamt-punkte-filter').addEventListener('input', updatePointFilter);
    updateMarkerVisibility();

    let allCategoriesOn = true;
    toggleBtn.addEventListener('click', () => {
      allCategoriesOn = !allCategoriesOn;
      Object.values(categoryLayers).forEach(l => {
        if (allCategoriesOn) map.addLayer(l); else map.removeLayer(l);
      });
      toggleBtn.textContent = allCategoriesOn ? 'Alle Kategorien abwählen' : 'Alle Kategorien auswählen';
      updateMarkerVisibility();
    });
  </script>
</body>
</html>
