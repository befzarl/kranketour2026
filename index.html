<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Kranke Tour 2026 Karte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    #filters {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      display: grid;
      gap: 6px;
      padding: 10px;
      background: white;
      border-radius: 6px;
      box-shadow: 0 0 6px #888;
      font-size: 14px;
    }
    #filters label {
      display: grid;
      gap: 3px;
    }
    #filters input[type="range"] {
      width: 160px;
    }
    .filter-label {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .filter-value {
      min-width: 3ch;
      text-align: right;
    }
    #legend {
      position: absolute;
      bottom: 30px;
      left: 10px;
      max-height: 38vh;
      overflow-y: auto;
      background: white;
      padding: 10px;
      border-radius: 6px;
      box-shadow: 0 0 6px #888;
      font-size: 14px;
      z-index: 1000;
    }
    .leaflet-control-layers-expanded {
      max-height: 60vh;
      overflow-y: auto;
    }
    @media (max-width: 600px) {
      #legend {
        bottom: 50px;
        max-width: calc(100vw - 100px);
        max-height: 22vh;
        padding: 6px 8px;
        font-size: 12px;
      }
      #filters {
        top: 10px;
        right: 10px;
        padding: 6px 8px;
        font-size: 12px;
      }
      #filters input[type="range"] {
        width: 128px;
      }
      .leaflet-control-layers-expanded {
        max-width: calc(100vw - 70px);
        max-height: 45vh;
        font-size: 13px;
      }
      .leaflet-control-layers-selector {
        width: 18px;
        height: 18px;
        vertical-align: middle;
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="filters">
    <label>
      <span class="filter-label">Mind. Bahnhofspunkte <output id="bahnhof-punkte-wert" class="filter-value">0</output></span>
      <input id="bahnhof-punkte-filter" type="range" min="0" max="750" step="5" value="0" />
    </label>
    <label>
      <span class="filter-label">Mind. Aufgabenpunkte <output id="aufgaben-punkte-wert" class="filter-value">0</output></span>
      <input id="aufgaben-punkte-filter" type="range" min="0" max="120" step="5" value="0" />
    </label>
  </div>
  <div id="legend"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="coordinates.js"></script>
  <script>
    const map = L.map('map').setView([51, 10], 6);
    const bw = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors & CartoDB'
    }).addTo(map);
    const railwayLayer = L.tileLayer('https://tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png', {
      minZoom: 2,
      maxZoom: 19,
      tileSize: 256,
      attribution: '<a href="https://www.openstreetmap.org/copyright">&copy; OpenStreetMap contributors</a>, Style: <a href="https://creativecommons.org/licenses/by-sa/2.0/">CC-BY-SA 2.0</a> <a href="https://www.openrailwaymap.org/">OpenRailwayMap</a>',
      opacity: 0.7
    }).addTo(map);

    const classicMarkers = L.layerGroup();
    const bhfPaarLayer = L.layerGroup();
    const partnerCityLayer = L.layerGroup();
    const categoryLayers = Object.fromEntries(
      Object.keys(lostopfColors).map(name => [name, L.layerGroup().addTo(map)])
    );
    const primaryFeatures = [];
    const secondaryFeatures = [];

    function markerRadius(points) {
      const radius = Math.min(17, Math.max(7, 5 + Math.sqrt(Number(points || 0)) * 1.2));
      return window.matchMedia('(max-width: 600px)').matches ? radius * 0.75 : radius;
    }

    function stationPopup(coord) {
      return `<b>Bahnhof: ${coord.bahnhof || '-'}</b><br>
        Los: ${coord.id}<br>
        Punkte Bahnhof: ${coord.punkte_bahnhof ?? '-'}<br>
        Lostopf: ${coord.lostopf}<br>
        Aufgabenbeschreibung: ${coord.aufgabe || '-'}`;
    }

    function taskPopup(coord) {
      return `<b>Aufgabe: ${coord.aufgabenadresse || '-'}</b><br>
        Los: ${coord.id}<br>
        Zeitbedarf: ${coord.zeitbedarf ?? '-'} min<br>
        Distanz: ${coord.distanz ?? '-'} km<br>
        Punkte Aufgabe: ${coord.punkte_aufgabe ?? '-'}<br>
        Punkte Bonus: ${coord.punkte_bonus ?? '-'}<br>
        Lostopf: ${coord.lostopf}<br>
        Aufgabenbeschreibung: ${coord.aufgabe || '-'}`;
    }

    if (Array.isArray(coordinates)) {
      coordinates.forEach(coord => {
        const color = lostopfColors[coord.lostopf] || lostopfColors.Unbekannt;
        const categoryLayer = categoryLayers[coord.lostopf] || categoryLayers.Unbekannt;
        const classicMarker = L.marker([coord.latitude, coord.longitude]).bindPopup(stationPopup(coord));
        const categoryMarker = L.circleMarker([coord.latitude, coord.longitude], {
          radius: markerRadius(coord.punkte_bahnhof),
          color, fillColor: color, fillOpacity: 1, weight: 2
        }).bindPopup(stationPopup(coord));
        const totalPointsRing = L.circleMarker([coord.latitude, coord.longitude], {
          radius: markerRadius(Number(coord.punkte_bahnhof || 0) + Number(coord.punkte_aufgabe || 0)),
          color, fill: false, weight: 2
        }).bindPopup(stationPopup(coord));
        primaryFeatures.push({ coord, classicMarker, categoryMarker, totalPointsRing, categoryLayer });

        if (coord.latitude2 !== null && coord.longitude2 !== null) {
          const marker = L.circleMarker([coord.latitude2, coord.longitude2], {
            radius: markerRadius(coord.punkte_aufgabe),
            color, fillColor: color, fillOpacity: 1, weight: 2
          }).bindPopup(taskPopup(coord));
          const line = L.polyline([[coord.latitude, coord.longitude], [coord.latitude2, coord.longitude2]], {
            color, weight: 2, opacity: 0.7, dashArray: '4, 8'
          });
          secondaryFeatures.push({ coord, marker, line, categoryLayer });
        }
      });
    }

    function meetsPointFilter(coord) {
      const minimumStationPoints = Number(document.getElementById('bahnhof-punkte-filter').value) || 0;
      const minimumTaskPoints = Number(document.getElementById('aufgaben-punkte-filter').value) || 0;
      return Number(coord.punkte_bahnhof || 0) >= minimumStationPoints
        && Number(coord.punkte_aufgabe || 0) >= minimumTaskPoints;
    }

    function updateMarkerVisibility() {
      const showTasks = map.getZoom() >= 15;
      primaryFeatures.forEach(({ coord, classicMarker, categoryMarker, totalPointsRing, categoryLayer }) => {
        if (meetsPointFilter(coord)) {
          classicMarker.addTo(classicMarkers);
          categoryMarker.addTo(categoryLayer);
          if (showTasks) {
            categoryLayer.removeLayer(totalPointsRing);
          } else {
            totalPointsRing.addTo(categoryLayer);
          }
        } else {
          classicMarkers.removeLayer(classicMarker);
          categoryLayer.removeLayer(categoryMarker);
          categoryLayer.removeLayer(totalPointsRing);
        }
      });


      secondaryFeatures.forEach(({ coord, marker, line, categoryLayer }) => {
        if (showTasks && meetsPointFilter(coord)) {
          marker.addTo(categoryLayer);
          line.addTo(categoryLayer);
        } else {
          categoryLayer.removeLayer(marker);
          categoryLayer.removeLayer(line);
        }
      });
    }

    function updatePointFilter() {
      document.getElementById('bahnhof-punkte-wert').value = document.getElementById('bahnhof-punkte-filter').value;
      document.getElementById('aufgaben-punkte-wert').value = document.getElementById('aufgaben-punkte-filter').value;
      updateMarkerVisibility();
    }

    document.getElementById('bahnhof-punkte-filter').addEventListener('input', updatePointFilter);
    document.getElementById('aufgaben-punkte-filter').addEventListener('input', updatePointFilter);
    map.on('zoomend', updateMarkerVisibility);
    updateMarkerVisibility();

    if (Array.isArray(bhfPaarLines)) {
      bhfPaarLines.forEach(lineCoords => {
        L.polyline(lineCoords, { color: lostopfColors['Bhf-Paare'], weight: 4, opacity: 0.7, dashArray: '6, 6' }).addTo(bhfPaarLayer);
      });
    }
    if (Array.isArray(partnerCityLines)) {
      partnerCityLines.forEach(lineCoords => {
        L.polyline(lineCoords, { color: lostopfColors['Partnerstädte'], weight: 4, opacity: 0.7, dashArray: '6, 6' }).addTo(partnerCityLayer);
      });
    }

    if (coordinates.length) {
      map.fitBounds(L.latLngBounds(coordinates.map(coord => [coord.latitude, coord.longitude])), { padding: [20, 20] });
    }

    document.getElementById('legend').innerHTML = '<b>Lostopf</b><br>' + Object.entries(lostopfColors)
      .map(([name, color]) => `<span style="display:inline-block;width:16px;height:16px;background:${color};margin-right:6px;border-radius:50%;border:1px solid #888"></span>${name}`)
      .join('<br>');

    const overlays = {
      'OpenRailwayMap': railwayLayer,
      'Klassische Marker': classicMarkers,
      'Bahnhofspaar-Linien': bhfPaarLayer,
      'Partnerstadt-Linien': partnerCityLayer
    };
    Object.entries(categoryLayers).forEach(([name, layer]) => {
      overlays[`Lostopf: ${name}`] = layer;
    });
    const compactLayout = window.matchMedia('(max-width: 600px)').matches;
    L.control.layers({ 'Schwarz-Weiß': bw }, overlays, { collapsed: compactLayout }).addTo(map);
  </script>
</body>
</html>
